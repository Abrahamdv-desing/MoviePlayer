<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora JavaScript</title>
    <style>
        /* Estilos CSS para el diseño visual */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }

        .calculadora {
            background-color: #1e222b;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            width: 320px;
        }

        #pantalla {
            width: 100%;
            height: 60px;
            background-color: #2d323f;
            border: none;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #ffffff;
            font-size: 1.8rem;
            text-align: right;
            padding: 0 15px;
            box-sizing: border-box;
        }

        .botones {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 18px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #3a3f4d;
            color: #ffffff;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #4a5161;
        }

        button.operador {
            background-color: #ff9f0a;
            color: #ffffff;
        }

        button.operador:hover {
            background-color: #cc7f08;
        }

        button.clear {
            background-color: #f44336;
            grid-column: span 2;
        }

        button.clear:hover {
            background-color: #d32f2f;
        }

        button.igual {
            background-color: #4caf50;
            grid-column: span 2;
        }

        button.igual:hover {
            background-color: #388e3c;
        }
    </style>
</head>

<body>

    <!-- Estructura HTML de la calculadora -->
    <div class="calculadora">
        <input type="text" id="pantalla" readonly value="0">
        <div class="botones">
            <button class="clear" onclick="limpiar()">C</button>
            <button class="operador" onclick="agregar('/')">÷</button>
            <button class="operador" onclick="agregar('*')">×</button>

            <button onclick="agregar('7')">7</button>
            <button onclick="agregar('8')">8</button>
            <button onclick="agregar('9')">9</button>
            <button class="operador" onclick="agregar('-')">-</button>

            <button onclick="agregar('4')">4</button>
            <button onclick="agregar('5')">5</button>
            <button onclick="agregar('6')">6</button>
            <button class="operador" onclick="agregar('+')">+</button>

            <button onclick="agregar('1')">1</button>
            <button onclick="agregar('2')">2</button>
            <button onclick="agregar('3')">3</button>
            <button onclick="agregar('.')">.</button>

            <button onclick="agregar('0')">0</button>
            <button class="igual" onclick="calcular()">=</button>
        </div>
    </div>

    <!-- Lógica de funcionamiento en JavaScript -->
    <script>
        const pantalla = document.getElementById('pantalla');

        function agregar(valor) {
            if (pantalla.value === '0' && valor !== '.') {
                pantalla.value = valor;
            } else {
                pantalla.value += valor;
            }
        }

        function limpiar() {
            pantalla.value = '0';
        }

        function calcular() {
            try {
                // eval realiza el cálculo matemático de la cadena de texto
                pantalla.value = eval(pantalla.value);
            } catch (error) {
                pantalla.value = 'Error';
                setTimeout(limpiar, 1500);
            }
        }
    </script>
</body>

</html>
